name: Extension checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression tests
        run: node --test tests/*.test.mjs
      - name: Check JavaScript
        run: |
          node --check service-worker.js
          node --check options.js
          node --check popup.js
          node --check tests/browser/firefox-driver.mjs
          node --check tests/browser/smoke.test.mjs
      - name: Install browser test tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated test browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Browser conversions and downloads
        run: npm run test:browser
      - name: Prepare browser packages
        run: node scripts/prepare-release.mjs
      - name: Validate Firefox extension
        run: npx --yes web-ext@10.6.0 lint --source-dir dist/firefox --warnings-as-errors
