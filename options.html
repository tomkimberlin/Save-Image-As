<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Save Image As Settings</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="page">
      <section class="panel">
        <h1>Save Image As</h1>
        <p class="lede">
          Choose how converted downloads behave. PNG is always lossless, while JPG and WebP use the quality levels below.
        </p>

        <form id="settings-form" class="settings-form">
          <div class="field">
            <label for="jpeg-quality">JPG quality</label>
            <input id="jpeg-quality" name="jpeg-quality" type="range" min="0.1" max="1" step="0.01" value="0.92" aria-describedby="jpeg-quality-value">
            <output id="jpeg-quality-value" for="jpeg-quality">92%</output>
          </div>

          <div class="field">
            <label for="webp-quality">WebP quality</label>
            <input id="webp-quality" name="webp-quality" type="range" min="0.1" max="1" step="0.01" value="0.9" aria-describedby="webp-quality-value">
            <output id="webp-quality-value" for="webp-quality">90%</output>
          </div>

          <label class="checkbox-field">
            <input id="save-as-dialog" name="save-as-dialog" type="checkbox" checked>
            <span>Show the browser's Save As dialog before downloading</span>
          </label>

          <div class="actions">
            <button type="submit">Save settings</button>
            <button id="reset-button" type="button" class="secondary">Reset defaults</button>
          </div>
        </form>

        <p id="status" class="status" aria-live="polite"></p>
        <p class="project-link"><a href="https://github.com/tomkimberlin/Save-Image-As" target="_blank" rel="noreferrer">Open source on GitHub</a></p>
      </section>
    </main>

    <script src="options.js"></script>
  </body>
</html>
