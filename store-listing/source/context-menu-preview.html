<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Save Image As Context Menu Preview</title>
    <style>
      :root {
        font-family: "Segoe UI", Arial, sans-serif;
        color: #17324d;
        background: #eaf1f7;
      }

      * { box-sizing: border-box; }
      body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }

      .browser {
        position: relative;
        width: 1160px;
        height: 690px;
        margin: 55px auto;
        overflow: hidden;
        border: 1px solid #c7d4df;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 28px 70px rgba(30, 64, 92, 0.18);
      }

      .chrome {
        height: 58px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 22px;
        border-bottom: 1px solid #dce5ec;
        background: #f7f9fb;
      }

      .dot { width: 11px; height: 11px; border-radius: 50%; background: #b8c6d1; }
      .address {
        width: 620px;
        height: 32px;
        margin-left: 16px;
        border-radius: 16px;
        background: #e8eef3;
      }

      .content {
        display: grid;
        grid-template-columns: 700px 1fr;
        gap: 56px;
        padding: 54px;
      }

      .photo {
        position: relative;
        height: 520px;
        overflow: hidden;
        border-radius: 22px;
        background: linear-gradient(180deg, #88cef4 0 52%, #dcecb0 52% 100%);
        box-shadow: inset 0 0 0 1px rgba(20, 69, 104, 0.12);
      }

      .sun {
        position: absolute;
        top: 54px;
        right: 76px;
        width: 74px;
        height: 74px;
        border-radius: 50%;
        background: #fff7c7;
      }

      .mountain {
        position: absolute;
        bottom: 110px;
        width: 0;
        height: 0;
        border-left: 190px solid transparent;
        border-right: 190px solid transparent;
        border-bottom: 260px solid #236b91;
      }

      .mountain.one { left: 15px; }
      .mountain.two { left: 300px; bottom: 80px; transform: scale(0.78); border-bottom-color: #165276; }
      .ground { position: absolute; inset: auto 0 0; height: 132px; background: #6fa56c; }

      .copy { padding-top: 44px; }
      .eyebrow { margin: 0 0 14px; color: #1261a0; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 48px; line-height: 1.08; letter-spacing: -0.035em; }
      .copy p:last-child { margin: 24px 0 0; color: #536b80; font-size: 21px; line-height: 1.55; }

      .menu,
      .submenu {
        position: absolute;
        z-index: 3;
        width: 230px;
        padding: 8px;
        border: 1px solid #cbd6df;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 18px 45px rgba(25, 50, 72, 0.24);
        font-size: 17px;
      }

      .menu { left: 410px; top: 270px; }
      .submenu { left: 642px; top: 320px; width: 145px; }
      .row { display: flex; align-items: center; justify-content: space-between; min-height: 42px; padding: 0 12px; border-radius: 7px; }
      .row.active { color: #ffffff; background: #1261a0; }
      .muted { color: #7a8d9d; }
      .separator { height: 1px; margin: 5px 4px; background: #e2e8ee; }
    </style>
  </head>
  <body>
    <main class="browser">
      <div class="chrome">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <div class="address"></div>
      </div>

      <section class="content">
        <div class="photo" aria-label="Landscape image preview">
          <div class="sun"></div>
          <div class="mountain one"></div>
          <div class="mountain two"></div>
          <div class="ground"></div>
        </div>
        <div class="copy">
          <p class="eyebrow">One simple menu</p>
          <h1>Convert images without leaving the page.</h1>
          <p>Right-click an image, choose a format, and save the converted file directly to your device.</p>
        </div>
      </section>

      <div class="menu" aria-label="Illustrated browser context menu">
        <div class="row muted"><span>Open image in new tab</span></div>
        <div class="row muted"><span>Copy image</span></div>
        <div class="separator"></div>
        <div class="row active"><span>Save image as</span><span>›</span></div>
      </div>
      <div class="submenu">
        <div class="row"><span>PNG</span></div>
        <div class="row"><span>JPG</span></div>
        <div class="row"><span>WebP</span></div>
      </div>
    </main>
  </body>
</html>
