<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Save Image As Marquee Promotional Tile</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 1400px;
        height: 560px;
        overflow: hidden;
        display: grid;
        grid-template-columns: 420px 1fr;
        align-items: center;
        padding: 70px 110px;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #ffffff;
        background:
          radial-gradient(circle at 90% 2%, rgba(83, 166, 222, 0.8), transparent 34%),
          radial-gradient(circle at 5% 98%, rgba(38, 116, 169, 0.9), transparent 35%),
          linear-gradient(135deg, #083d66, #1261a0);
      }
      img { width: 300px; height: 300px; border-radius: 58px; box-shadow: 0 30px 70px rgba(1, 25, 43, 0.34); }
      .eyebrow { margin: 0 0 18px; color: #cde8fb; font-size: 22px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 76px; line-height: 1; letter-spacing: -0.045em; }
      .summary { max-width: 700px; margin: 24px 0 0; color: #e4f3fd; font-size: 31px; line-height: 1.35; }
      .trust { margin: 28px 0 0; font-size: 21px; font-weight: 700; }
    </style>
  </head>
  <body>
    <img src="../assets/logo-300.png" alt="">
    <section>
      <p class="eyebrow">Right-click image conversion</p>
      <h1>Save Image As</h1>
      <p class="summary">Convert web images to PNG, JPG, or WebP—right from your browser.</p>
      <p class="trust">Local processing · No tracking · Open source</p>
    </section>
  </body>
</html>
