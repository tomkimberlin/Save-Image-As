<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Save Image As Small Promotional Tile</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
        display: flex;
        align-items: center;
        gap: 26px;
        padding: 42px;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #ffffff;
        background: radial-gradient(circle at 88% 5%, #2d82be, transparent 38%), linear-gradient(135deg, #0b4f82, #1261a0);
      }
      img { width: 112px; height: 112px; border-radius: 24px; box-shadow: 0 16px 34px rgba(3, 32, 54, 0.28); }
      h1 { margin: 0 0 10px; font-size: 32px; line-height: 1.05; letter-spacing: -0.03em; }
      p { margin: 0; color: #dceeff; font-size: 18px; line-height: 1.4; }
      .trust { margin-top: 14px; color: #ffffff; font-size: 14px; font-weight: 700; }
    </style>
  </head>
  <body>
    <img src="../assets/logo-300.png" alt="">
    <div>
      <h1>Save Image As</h1>
      <p>PNG · JPG · WebP</p>
      <p class="trust">Local · Private · Open source</p>
    </div>
  </body>
</html>
